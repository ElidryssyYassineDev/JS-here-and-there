<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Weather App</h1>

        <form action="">
            <label for="city">City:</label>
            <input id="city-input" type="text" placeholder="example:london,casablanca,fès">
            <input type="submit" value="Get Weather" class="weatherBtn">
        </form>

        <div id="weather-data">
            <div class="icon">
              <img src="http://openweathermap.org/img/wn/01d.png" alt="icon">
      
            </div>
            
            
            <div class="temperature">4°C</div> 
            <div class="description">overcast clouds</div>

            <div class="detail">
                <div>feels like: 4°C</div>
                <div>Humidity:40%</div>
                <div>Wind Speed: 5m/s</div>
            </div>
        </div>
    </div>
    

    <script src="index.js"></script>
</body>
</html>
