<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper Scissors Game</h1>
    <p>Choose your move</p>
    <div class="buttons">
        <button id="rockBtn" name="rock">
            &#x1f44a;
        </button>
        <button id="paperBtn" name="paper">
            &#x1f590;
        </button>
        <button id="scissorsBtn" name="scissors">
            &#x270c;
        </button>
    </div>
    
    <p id="result">YOU WON !</p>
    <div id="scores">
        your score: <span id="user-score" style="color: green;">0</span>
        Computer's score: <span id="computer-score" style="color: red;" >0</span>
    </div>

    <script src="index.js"></script>
</body>
</html>
